get:
  tags: [Contacts]
  summary: Get contact by id
  operationId: getContactById
  description: Returns a single contact by id for current user.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Contact found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Contact fetched successfully
              data:
                $ref: "../../swagger/components/schemas.contact.yaml#/Contact"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/StandardError"
    "404":
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/NotFound"
