get:
  tags: [Contacts]
  summary: Get contact by id
  operationId: getContactById
  description: Returns a single contact by id.
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  responses:
    "200":
      description: Contact found
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "../../swagger/components/schemas.contact.yaml#/Contact"
    "404":
      description: Contact not found
