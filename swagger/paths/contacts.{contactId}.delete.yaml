delete:
  tags: [Contacts]
  summary: Delete a contact
  operationId: deleteContact
  description: Deletes contact by id.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  responses:
    "204":
      description: Contact deleted (no content)
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/StandardError"
    "404":
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/NotFound"
