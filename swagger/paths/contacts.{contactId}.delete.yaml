delete:
  tags: [Contacts]
  summary: Delete a contact
  operationId: deleteContact
  description: Deletes contact by id.
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  responses:
    "204":
      description: Contact deleted
    "404":
      description: Contact not found
