post:
  tags: [Contacts]
  summary: Create a contact
  operationId: createContact
  description: Creates a contact for current user.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../swagger/components/schemas.requests.yaml#/CreateContactInput"
  responses:
    "201":
      description: Contact created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "../../swagger/components/schemas.contact.yaml#/Contact"
    "400":
      description: Validation error
