patch:
  tags: [Contacts]
  summary: Update a contact
  operationId: updateContact
  description: Updates contact fields.
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../swagger/components/schemas.requests.yaml#/UpdateContactInput"
  responses:
    "200":
      description: Contact updated
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "../../swagger/components/schemas.contact.yaml#/Contact"
    "404":
      description: Contact not found
