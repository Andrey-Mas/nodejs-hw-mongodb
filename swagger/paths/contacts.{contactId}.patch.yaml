patch:
  tags: [Contacts]
  summary: Update a contact
  operationId: updateContact
  description: Updates contact fields. Supports photo replacement upload.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: "../../swagger/components/schemas.requests.yaml#/UpdateContactInput"
  responses:
    "200":
      description: Contact updated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Contact updated successfully
              data:
                $ref: "../../swagger/components/schemas.contact.yaml#/Contact"
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/StandardError"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/StandardError"
    "404":
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: "../../swagger/components/responses.yaml#/NotFound"
