CreateContactInput:
  type: object
  required: [name, phoneNumber, contactType]
  properties:
    name: { type: string, example: "Alice" }
    phoneNumber: { type: string, example: "+1 202 555 0147" }
    email: { type: string, example: "alice@example.com" }
    isFavourite: { type: boolean, example: false }
    contactType: { type: string, enum: [work, home, personal], example: personal }

UpdateContactInput:
  type: object
  properties:
    name: { type: string }
    phoneNumber: { type: string }
    email: { type: string }
    isFavourite: { type: boolean }
    contactType: { type: string, enum: [work, home, personal] }
